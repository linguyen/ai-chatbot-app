# docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      CORS_ALLOW_ORIGINS: "*"
      CSRF_TRUSTED_ORIGINS: "*"
      JWT_SECRET_KEY: change-this-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8888 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "5175:5175"
    volumes:
      - ./frontend/app:/app  # Sync frontend app source for Vite hot-reload
      - /app/node_modules # Prevents local node_modules from wiping out container packages
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps file watching on Windows/macOS bind mounts
    stdin_open: true # Keeps interactive processes running smoothly
    tty: true
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
