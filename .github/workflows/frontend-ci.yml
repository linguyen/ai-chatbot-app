name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Frontend Build (Node 20)
    runs-on: self-hosted # Targets your self-hosted runner

    defaults:
      run:
        working-directory: ./frontend # Automatically sets directory for all run steps

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: npm ci

      - name: Build frontend
        working-directory: frontend/app
        run: npm run build

      - name: Backup current deployment
        shell: powershell
        run: |
          $backupRoot = 'C:\Backups\chatbot.careai.vn'
          $backup = Join-Path $backupRoot (Get-Date -Format 'yyyyMMddHHmmss')
          New-Item -ItemType Directory -Force -Path $backupRoot
          New-Item -ItemType Directory -Force -Path $backup
          if (Test-Path 'C:\inetpub\wwwroot\chatbot.careai.vn') {
            robocopy C:\inetpub\wwwroot\chatbot.careai.vn $backup /E
            if ($LASTEXITCODE -lt 8) { exit 0 } else { exit $LASTEXITCODE }
          }
          Write-Host 'No current deployment found. Skipping backup.'

      - name: Deploy
        shell: powershell
        run: |
          robocopy app/dist C:\inetpub\wwwroot\chatbot.careai.vn /MIR
          if ($LASTEXITCODE -lt 8) { exit 0 } else { exit $LASTEXITCODE }

      - name: Verify deployment
        shell: powershell
        run: |
          if (!(Test-Path "C:\inetpub\wwwroot\chatbot.careai.vn\index.html")) {
            throw "Deployment failed: index.html not found."
          }
